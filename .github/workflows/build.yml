name: nf-fairscape CI
on:
  push:
    branches:
      - 'main'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
jobs:
  build:
    name: Build nf-fairscape
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java_version: [17]
        nextflow_version: ['25.10']

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      # setup-java@v1 silently ignored `distribution`; v4 requires and honours it
      - name: Setup Java ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java_version}}
          distribution: 'temurin'

      - name: Unit tests
        run: make test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Setup Nextflow ${{ matrix.nextflow_version }}
        uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # v1
        with:
          version: "${{ matrix.nextflow_version }}"

      - name: Install
        run: make install

      - name: Test
        run: nextflow run nf-fairscape-test/ -plugins nf-fairscape@$(cat VERSION)

      # the acceptance oracle: the emitted crate must validate against
      # fairscape_models and contain no dangling ARK references
      # (results/ is relative to the launch dir, which here is the repo root)
      - name: Validate crate
        run: |
          python3 -m pip install --quiet fairscape-models
          python3 nf-fairscape-test/validate_crate.py results/ro-crate-metadata.json
