
plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.12'
}

version = project.file('VERSION').text.trim()

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'nextflow'
    className = 'nextflow.prov.ProvPlugin'
    extensionPoints = [
        'nextflow.prov.FairscapeConfig',
        'nextflow.prov.ProvObserverFactory'
    ]
}

// `tools/parity.sh` drives CrateArtifactsTest against a prepared crate directory
// to diff the datasheet/evidence-graph output against fairscape-cli's. Forward
// its properties into the test JVM and always re-run when it is in play.
tasks.withType(Test).configureEach {
    final parityDir = System.getProperty('parityDir')
    if( parityDir ) {
        systemProperty 'parityDir', parityDir
        systemProperty 'parityStep', System.getProperty('parityStep', 'all')
        outputs.upToDateWhen { false }
    }
}
